# Desktop build (our overlay branch only) — builds Jackdaw on each desktop OS.
#
# Fully mise-driven now that the tasks are cross-platform: `mise run build`
# pulls in `setup-deps` (host deps per OS: Linux apt / macOS Xcode CLT /
# Windows MSVC) and cmake, then runs cargo build. Rust nightly resolves from
# rust-toolchain.toml via rustup. No per-OS steps needed in the workflow.
#
# Separate from upstream's ci.yaml (which only runs on `main` and does an
# ubuntu-only dynamic-linking build — no desktop matrix).
name: mise-desktop-build

on:
  push:
    branches: [joeblew999]
  pull_request:
    branches: [joeblew999]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Free disk for the large Bevy build (upstream ci.yaml does the same).
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mise-desktop-build-${{ matrix.os }}

      # mise run build = setup-deps (cross-platform host deps) -> cargo build.
      - name: Build
        run: mise run build
