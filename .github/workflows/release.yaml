# Release (our overlay branch) — build the editor on each desktop, then let the
# shared `release:github` task (joeblew999/.github) do the rest: regenerate the
# changelog, tag, push, `gh release create`, and upload + verify the assets.
#
# Manual trigger (release:github CREATES the tag, so we do NOT trigger on a tag).
# Dispatch with a fork-scheme version, e.g. v0.4.1-jb.1. Binaries only — NOT
# crates.io (that was upstream's release.yaml, removed on this branch).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (fork scheme, e.g. v0.4.1-jb.1)"
        required: true
        type: string

permissions:
  contents: write   # release:github pushes the changelog commit/tag + creates the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Build + package the per-OS archive on each desktop (same mise task locally).
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: jdx/mise-action@v2
        with:
          install: false      # only cmake needed to build (avoid cargo: dev tools)
          cache: true
      - run: mise install cmake
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.os }}
      - name: Build + package
        run: mise run release:stage
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: jackdaw-${{ matrix.os }}
          path: target/dist/*.tar.gz
          if-no-files-found: error

  # 2. Collect the archives and run the shared release:github (gh + git-cliff).
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # stay on the branch — release:github pushes HEAD
          fetch-depth: 0                 # git-cliff needs full history
      - uses: jdx/mise-action@v2
        with:
          install: false
          cache: true
      - run: mise run mise:global       # seed git-cliff + gh + nu (shared toolset)
      - uses: actions/download-artifact@v4
        with:
          path: target/dist
          merge-multiple: true          # flatten all matrix archives into target/dist/
      - name: release:github
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release:github -- "${{ inputs.version }}" target/dist/*.tar.gz
