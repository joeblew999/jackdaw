# Jackdaw Editor — development task runner
# Usage: mise run <task>   |   mise tasks   |   mise tasks --hidden
#
# ╔══════════════════════════════════════════════════════════╗
# ║  QUICK START                                            ║
# ║   1. mise run setup    — first-time build (deps + editor)║
# ║   2. mise run open     — launch the editor               ║
# ╚══════════════════════════════════════════════════════════╝
#
# NAMING — colon-namespaced (build:dylib, open:project, dist:install, clean:all)
# so `mise tasks` groups them. Base verbs (build/run/open/test/fmt/doc/clean)
# are the common case; colon variants are specializations. Matches the
# convention in joeblew999/.github (mise:sweep, cliff:release, ci:check-global).
#
# CROSS-PLATFORM — tasks with logic are nushell (`#!/usr/bin/env nu`) so they run
# identically on Linux/macOS/Windows. Single-command `cargo …` tasks stay as-is.
# No sh-isms (cat/find/cp/rm/$VAR/&&//tmp) — use nushell built-ins.
#
# SELF-CONTAINED BUILD — `mise run build` depends on `setup:deps`, which installs
# the host deps mise can't (Bevy alsa/udev/wayland + a C/C++ toolchain), per OS.
# So it builds from a clean checkout on any desktop — what the CI relies on.
#
# WHERE OUTPUTS GO                                        → HOW TO CLEAN
#   target/             cargo build/run/test (gitignored;   mise run clean
#                       reaches tens of GB)
#   ~/.cargo/bin/jackdaw  dist:install (crates.io build)     mise run clean:dist
#   .cargo/config.toml  build:fast:on overwrites this        mise run build:fast:off
#                       committed file (Windows linker fix)   (restores it via git)
#   <location>/<name>   new:extension / new:game (you pick    delete it yourself
#                       the dir) — not under this repo
#   ── mise run clean:all = clean + clean:dist + restore .cargo/config.toml ──

# ─── Shared task library (joeblew999/.github) ───────────
# Pulls mise:* tasks (incl. mise:global, which the reusable CI workflow runs)
# and ci:check-global. Bump this ?ref= together with the workflow @ref in
# .github/workflows/mise.yaml. CI = joeblew999/.github reusable-mise-ci.yml.
[settings]
experimental = true   # required by the shared task lib

[task_config]
includes = [
  "git::https://github.com/joeblew999/.github.git//tasks/mise.toml?ref=v0.35.1",
  # cliff:release — git-cliff changelog + tag + push + `gh release create` +
  # asset upload (verified). The release workflow runs this with the per-OS
  # archives built by release:stage.
  "git::https://github.com/joeblew999/.github.git//tasks/cliff.toml?ref=v0.35.1",
]

# ─── Tools ──────────────────────────────────────────────

[tools]
# Only cmake is needed to BUILD (manifold-csg-sys's build script invokes it).
# Dev-only `cargo:` tools (bevy_cli, cargo-nextest) are pinned PER-TASK, NOT here,
# so CI's `mise install` doesn't compile them via the cargo: backend — which
# fails on Windows against the pinned nightly (rustup cargo-component conflict:
# "cargo.exe not applicable to nightly-… toolchain").
cmake = "latest"
# NOTE: the nightly is pinned in rust-toolchain.toml (#![feature(try_trait_v2)]).
# We do NOT set RUSTUP_TOOLCHAIN / manage `rust` via mise — that would override
# rust-toolchain.toml. rustup honors the file on its own. nushell (the task shell)
# is a ubiquitous GLOBAL mise tool, not pinned here.

# ─── setup: ─────────────────────────────────────────────

# Install host build prerequisites mise can't manage (Bevy alsa/udev/wayland +
# C/C++ toolchain; cmake comes from mise). OS-dispatching + idempotent (fast,
# no-sudo skip when satisfied), so the build tasks can depend on it cheaply.
[tasks."setup:deps"]
description = "Install host build prerequisites (Bevy sys deps + C/C++ toolchain). OS-dispatching; idempotent."
hide = true   # plumbing: runs automatically as a build dependency
run = '''
#!/usr/bin/env nu
def main [] {
  match $nu.os-info.name {
    "linux"   => { linux-deps }
    "macos"   => { macos-deps }
    "windows" => { windows-deps }
    _ => { print -e $"✗ unsupported OS: ($nu.os-info.name)"; exit 1 }
  }
}

def pc-has [name: string] {
  (do { ^pkg-config --exists $name } | complete).exit_code == 0
}

def linux-deps [] {
  if (
    (which pkg-config | is-not-empty)
    and (pc-has "alsa") and (pc-has "libudev") and (pc-has "wayland-client")
    and (which cc | is-not-empty)
  ) {
    print "✓ linux build prerequisites already satisfied"
    return
  }
  if (which apt-get | is-not-empty) {
    print "→ apt: libasound2-dev libudev-dev libwayland-dev build-essential pkg-config"
    ^sudo apt-get update
    ^sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev libwayland-dev build-essential pkg-config
  } else if (which dnf | is-not-empty) {
    print "→ dnf: alsa-lib-devel systemd-devel wayland-devel gcc-c++ pkgconf-pkg-config"
    ^sudo dnf install -y alsa-lib-devel systemd-devel wayland-devel gcc-c++ pkgconf-pkg-config
  } else if (which pacman | is-not-empty) {
    print "→ pacman: alsa-lib systemd libwayland base-devel pkgconf"
    ^sudo pacman -S --needed --noconfirm alsa-lib systemd libwayland base-devel pkgconf
  } else {
    print -e "✗ no supported package manager (apt-get/dnf/pacman)."
    print -e "  Install manually: alsa, udev/systemd, wayland dev headers + a C/C++ toolchain + pkg-config."
    exit 1
  }
  print "✓ linux build prerequisites installed"
}

def macos-deps [] {
  if (do { ^xcode-select -p } | complete).exit_code == 0 {
    print "✓ Xcode Command Line Tools present (clang available)"
  } else {
    print "→ installing Xcode Command Line Tools (a GUI dialog may appear)…"
    ^xcode-select --install
    print -e "  complete the dialog, then re-run `mise run setup:deps`"
    exit 1
  }
}

def windows-deps [] {
  if (which cl | is-not-empty) {
    print "✓ MSVC compiler (cl.exe) already on PATH"
    return
  }
  if (which winget | is-not-empty) {
    print "→ winget: Microsoft.VisualStudio.2022.BuildTools (+ C++ workload)"
    ^winget install --id Microsoft.VisualStudio.2022.BuildTools --accept-source-agreements --accept-package-agreements --override "--quiet --wait --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"
    print -e "  open a 'Developer Command Prompt for VS' (or restart the shell) so cl.exe is on PATH, then `mise run build`"
  } else {
    print -e "✗ winget not found. Install MSVC Build Tools manually:"
    print -e "  https://visualstudio.microsoft.com/downloads/ → 'Build Tools for Visual Studio' → 'Desktop development with C++'"
    exit 1
  }
}
'''

[tasks.setup]
description = "First-time setup: build editor + SDK dylib + rustc wrapper"
depends = ["build:dylib", "build:wrapper"]
run = '''
#!/usr/bin/env nu
print ""
print "Setup complete! Run 'mise run open' to launch the editor."
'''

# ─── build: ─────────────────────────────────────────────

[tasks.build]
description = "Build the editor (debug)"
depends = ["setup:deps"]
run = "cargo build"

[tasks."build:release"]
description = "Build the editor (release, no dev extensions)"
depends = ["setup:deps"]
run = "cargo build --release --no-default-features"

[tasks."release:stage"]
description = "Build release + package a GitHub-release archive (jackdaw_<ver>_<os>_<arch>.{tar.gz,zip})"
depends = ["setup:deps"]
run = '''
#!/usr/bin/env nu
# Version from the git tag in CI ($RELEASE_VERSION = github.ref_name), else the
# Cargo.toml version prefixed with v. Archive name is goreleaser-style.
def main [] {
  let version = ($env.RELEASE_VERSION? | default $"v(open Cargo.toml | get package.version)")
  let osname = (match $nu.os-info.name { "macos" => "darwin", "windows" => "windows", _ => "linux" })
  let arch = (match $nu.os-info.arch { "x86_64" => "amd64", "aarch64" => "arm64", $a => $a })
  let win = ($nu.os-info.name == "windows")
  let binext = (if $win { ".exe" } else { "" })

  print $"→ building jackdaw ($version) for ($osname)/($arch)"
  ^cargo build --release --no-default-features

  let name = $"jackdaw_($version)_($osname)_($arch)"
  let stage = $"target/dist/($name)"
  rm -rf $stage
  mkdir $stage
  for b in ["jackdaw" "jackdaw-rustc-wrapper"] {
    let p = $"target/release/($b)($binext)"
    if ($p | path exists) { cp $p $stage } else { print -e $"  ! missing ($p)" }
  }
  for f in ["README.md" "LICENSE-MIT" "LICENSE-APACHE"] {
    if ($f | path exists) { cp $f $stage }
  }
  cd target/dist
  if $win {
    ^tar -a -c -f $"($name).zip" $name          # bsdtar: -a = compress by extension (zip)
    print $"✓ target/dist/($name).zip"
  } else {
    ^tar -czf $"($name).tar.gz" $name
    print $"✓ target/dist/($name).tar.gz"
  }
}
'''

[tasks."build:dylib"]
description = "Build the editor with dylib/extension-loading support"
depends = ["setup:deps"]
run = "cargo build --features dylib"

[tasks."build:wrapper"]
description = "Build the rustc wrapper"
hide = true   # plumbing: internal, only built as part of `setup`
depends = ["setup:deps"]
run = "cargo build -p jackdaw_rustc_wrapper"

[tasks."build:fast:on"]
description = "Use the fast-build cargo config (LLD/Mold). Overwrites .cargo/config.toml"
run = '''
#!/usr/bin/env nu
cp .cargo/config_fast_builds.toml .cargo/config.toml
print "Fast-build cargo config active (.cargo/config.toml overwritten)."
print "Run 'mise run build:fast:off' to restore the committed config."
'''

[tasks."build:fast:off"]
description = "Restore the committed .cargo/config.toml (revert fast-build)"
run = '''
#!/usr/bin/env nu
# .cargo/config.toml is committed (carries the Windows rust-lld fix), so revert
# via git rather than deleting it.
^git checkout -- .cargo/config.toml
print "Restored committed .cargo/config.toml."
'''

# ─── run: / open: ───────────────────────────────────────

[tasks.run]
description = "Launch the editor (quick, no extension loading)"
run = "cargo run"

[tasks."run:bare"]
description = "Launch without the built-in example extensions"
run = "cargo run --no-default-features"

[tasks.open]
description = "Launch the editor with full extension support"
depends = ["setup"]
run = "cargo run --features dylib"

[tasks."open:project"]
description = "Open a project directory directly"
depends = ["setup"]
usage = 'arg "<path>"'
run = '''
#!/usr/bin/env nu
^cargo run --features dylib -- $env.usage_path
'''

[tasks."open:example"]
description = "Open the example scene (brush + lighting)"
depends = ["setup"]
run = 'cargo run --features dylib -- "{{config_root}}"'

[tasks."open:sample-extension"]
description = "Open the sample_extension example"
depends = ["setup"]
run = 'cargo run --features dylib -- "{{config_root}}/examples/sample_extension"'

[tasks."open:viewable-camera"]
description = "Open the viewable_camera_extension example"
depends = ["setup"]
run = 'cargo run --features dylib -- "{{config_root}}/examples/viewable_camera_extension"'

# ─── dist: (install/run the editor from THIS repo's origin) ──
# FORK-AWARE so the mise is reusable in any fork unchanged: installs from the
# `origin` remote (latest vX.Y.Z release tag, else default branch), with the
# binary name read from Cargo.toml — no hardcoded crate name or upstream URL.
# Forks publish no prebuilt binaries / aren't on crates.io, so we build from git.
# Installs to ~/.cargo/bin; `dist:` (not `release:`) avoids colliding with
# build:release (release-mode build).

[tasks."dist:install"]
description = "Install the editor from this repo's origin (latest release tag; fork-aware)"
run = '''
#!/usr/bin/env nu
let origin = (do { ^git remote get-url origin } | complete)
if $origin.exit_code != 0 { print -e "✗ no `origin` remote — run inside a git clone"; exit 1 }
let url = ($origin.stdout | str trim)
let pkg = (open Cargo.toml | get package.name)
let tags = (^git ls-remote --tags --refs $url "v*" | lines | parse --regex 'refs/tags/(?<t>v.+)$' | get t)
if ($tags | is-empty) {
  print $"→ installing ($pkg) from ($url) default branch (no release tag)"
  ^cargo install --git $url --locked $pkg
} else {
  let latest = ($tags | sort --natural | last)
  print $"→ installing ($pkg) ($latest) from ($url)"
  ^cargo install --git $url --tag $latest --locked $pkg
}
'''

[tasks."dist:run"]
description = "Install (if needed) and launch the editor (fork-aware binary name)"
depends = ["dist:install"]
run = '''
#!/usr/bin/env nu
run-external (open Cargo.toml | get package.name)
'''

# ─── new: (scaffolding) ─────────────────────────────────

[tasks."new:extension"]
description = "Scaffold a new extension"
tools = { "cargo:https://github.com/TheBevyFlock/bevy_cli" = { version = "tag:cli-v0.1.0-alpha.2", crate = "bevy_cli", bin = "bevy", locked = true } }
usage = 'arg "<name>" arg "[location]"'
run = '''
#!/usr/bin/env nu
let loc = ($env.usage_location? | default ($env.TMPDIR? | default ($env.TEMP? | default ($env.TMP? | default "/tmp"))))
cd $loc
^bevy new -t https://github.com/jbuehler23/jackdaw_template_extension --yes $env.usage_name
print ""
print $"Extension created at ($loc | path join $env.usage_name)"
print $"Edit ($loc | path join $env.usage_name 'src' 'lib.rs'), then build from the editor."
'''

[tasks."new:game"]
description = "Scaffold a new game project"
tools = { "cargo:https://github.com/TheBevyFlock/bevy_cli" = { version = "tag:cli-v0.1.0-alpha.2", crate = "bevy_cli", bin = "bevy", locked = true } }
usage = 'arg "<name>" arg "[location]"'
run = '''
#!/usr/bin/env nu
let loc = ($env.usage_location? | default ($env.TMPDIR? | default ($env.TEMP? | default ($env.TMP? | default "/tmp"))))
cd $loc
^bevy new -t https://github.com/jbuehler23/jackdaw_template_game --yes $env.usage_name
print ""
print $"Game created at ($loc | path join $env.usage_name)"
print "Open it from the editor launcher."
'''

# ─── info: ──────────────────────────────────────────────

[tasks.info]
description = "Show project info for this repo"
run = '''
#!/usr/bin/env nu
print "Project config:"
let cfg = (["./.jsn/project.jsn" "./project.jsn"] | where {|p| ($p | path exists)})
if ($cfg | is-not-empty) { open --raw ($cfg | first) | print } else { print "  No project.jsn found" }
print ""
print "Scenes:"
let scenes = (glob "assets/**/*.jsn" | where {|p| ($p | path basename) != "project.jsn"})
if ($scenes | is-empty) { print "  No scenes found" } else { for s in $scenes { print $"  ($s)" } }
print ""
print "Project metadata (.jsn/):"
if (".jsn" | path exists) { for n in (ls .jsn | get name) { print $"  ($n)" } } else { print "  No .jsn/ directory" }
'''

[tasks."info:scenes"]
description = "List all scenes"
run = '''
#!/usr/bin/env nu
let scenes = ((glob "assets/**/*.jsn") ++ (glob "examples/assets/**/*.jsn") | where {|p| ($p | path basename) != "project.jsn"})
if ($scenes | is-empty) { print "No scenes found" } else { for s in $scenes { print $s } }
'''

[tasks."info:recent"]
description = "List recent projects opened in the editor"
run = '''
#!/usr/bin/env nu
let f = ($nu.home-dir | path join ".config" "jackdaw" "recent.json")
if ($f | path exists) { open --raw $f | print } else { print "No recent projects yet." }
'''

# ─── test: ──────────────────────────────────────────────

[tasks.test]
description = "Run all tests"
run = "cargo test --workspace"

[tasks."test:nextest"]
description = "Run tests with nextest"
tools = { "cargo:cargo-nextest" = "latest" }   # per-task: not installed in CI build
run = "cargo nextest run --workspace --lib --bins --tests --no-fail-fast --no-tests warn"

[tasks."test:doc"]
description = "Run doc tests only"
run = "cargo test --workspace --doc"

# ─── fmt: / clippy / doc: ───────────────────────────────

[tasks.fmt]
description = "Apply formatting"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check formatting (no changes)"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Run clippy on the entire workspace"
run = "cargo clippy --workspace --all-targets -- --deny warnings"

[tasks.doc]
description = "Generate API docs"
run = "cargo doc --workspace --document-private-items --no-deps"

[tasks."doc:open"]
description = "Generate and open API docs in browser"
run = "cargo doc --workspace --document-private-items --no-deps --open"

# ─── ci ─────────────────────────────────────────────────

[tasks.ci]
description = "Run the full CI pipeline locally (format + clippy + test + doc)"
depends = ["fmt:check", "clippy", "test", "doc"]
run = '''
#!/usr/bin/env nu
print ""
print "All CI checks passed!"
'''

# ─── clean: ─────────────────────────────────────────────

[tasks.clean]
description = "Remove cargo build artifacts (target/ — can be tens of GB)"
run = "cargo clean"

[tasks."clean:dist"]
description = "Uninstall the crates.io-installed jackdaw (~/.cargo/bin)"
run = '''
#!/usr/bin/env nu
let r = (do { ^cargo uninstall jackdaw } | complete)
if $r.exit_code == 0 { print "✓ uninstalled jackdaw from ~/.cargo/bin" } else { print "nothing to uninstall (jackdaw not installed via cargo)" }
'''

[tasks."clean:all"]
description = "Clean everything: target/, the crates.io binary, and restore the cargo config"
depends = ["clean", "clean:dist"]
run = '''
#!/usr/bin/env nu
^git checkout -- .cargo/config.toml
print "✓ restored committed .cargo/config.toml"
print "✓ clean:all done (target/, crates.io binary, cargo config)"
'''
